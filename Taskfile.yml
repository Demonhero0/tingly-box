version: '3'

tasks:
  default:
    cmds:
      - task --list

  frontend:
    desc: Build the web UI into frontend/dist (embedded by go build)
    dir: frontend
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm build

  build:
    desc: Build the single binary with the embedded web UI
    deps: [frontend]
    cmds:
      - go build -o bin/tingly-project ./cmd/tingly-project

  swagger:
    aliases: [openapi]
    desc: Regenerate openapi.json from the registered routes
    cmds:
      - go run ./cmd/tingly-project swagger

  codegen:
    desc: Regenerate openapi.json and the typed frontend client
    cmds:
      - task: swagger
      - cd frontend && pnpm gen:api

  dev:backend:
    desc: Run the API server on :12590
    cmds:
      - go run ./cmd/tingly-project

  dev:frontend:
    desc: Run the Vite dev server (proxies /api to :12590)
    dir: frontend
    cmds:
      - pnpm dev

  ui:sync:
    desc: Refresh the vendored copy of Tingly Box's @tingly/ui (theme, icons, page primitives)
    vars:
      TINGLY_BOX: '{{.TINGLY_BOX | default "../tingly-box"}}'
    cmds:
      - rm -rf frontend/vendor/tingly-ui/src
      - cp -r {{.TINGLY_BOX}}/frontend/packages/ui/src {{.TINGLY_BOX}}/frontend/packages/ui/package.json frontend/vendor/tingly-ui/
      - git -C {{.TINGLY_BOX}} rev-parse --short HEAD > frontend/vendor/tingly-ui/SOURCE_COMMIT

  boundary:
    desc: Fail if this module imports Tingly Box's root module (Tingly Box imports us, never the other way)
    cmds:
      - "! go list -deps ./... | grep -E '^github.com/tingly-dev/tingly-box(/internal|/pkg|$)'"

  test:
    desc: Backend and frontend tests, typecheck and lint
    cmds:
      - task: boundary
      - go vet ./...
      - go test ./...
      - cd frontend && pnpm typecheck && pnpm lint && pnpm test
